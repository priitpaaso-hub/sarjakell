<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sarjakell</title>
  <meta name="description" content="Pere seriaalide märkmik, mis teavitab uute osade ilmumisest.">
  <meta name="theme-color" content="#0e1116">
  <script>
    (function () {
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      function apply() {
        var p = 'auto';
        try { p = localStorage.getItem('theme') || 'auto'; } catch (e) {}
        var t = p === 'light' || p === 'dark' ? p : (mq.matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name=theme-color]');
        if (m) m.setAttribute('content', t === 'light' ? '#f5f3ef' : '#0e1116');
      }
      window.__applyTheme = apply;
      apply();
      if (mq.addEventListener) mq.addEventListener('change', apply);
    })();
  </script>
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sarjakell">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><div class="splash"><img src="icons/icon-192.png" alt=""><p>Sarjakell</p></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
